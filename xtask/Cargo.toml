[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha2 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
pkcs8 = { version = "0.11.0", features = ["pem"] }
serde_json = "1"
ed25519-compact = { version = "2.2.0", default-features = false }
