[pytest]
pythonpath = tests .
addopts = --tb=short
markers =
    hil: Requires a selected physical Pager board; enable with --run-hil
    smoke: Fast non-destructive USB and serial diagnostic checks
    contract: Non-destructive WebUSB, slot and keyboard contract checks
    dfu: Destructive signed-UF2 flashing and bootloader checks
    ble: Bluetooth Low Energy GATT and HID checks
