[workspace]
members = [".", "xtask", "bootloader-core"]
exclude = ["bootloader-updater", "bootloader", "xiao-installer", "vendor/trouble-host", "vendor/host-macros", "vendor/embassy-nrf"]

[package]
name = "pager"
version = "0.1.0"
edition = "2021"

[features]
default = ["board-nice-nano-v2"]
board-nice-nano-v2 = []
board-xiao-nrf52840 = []

[build-dependencies]
serde_json = "1.0.151"

[dependencies]
# Pure storage codec dependencies are also built for host-side power-loss and
# round-trip tests.
embedded-storage-async = "0.4.2"
heapless = "0.9.3"
embassy-sync = "0.8.0"
static_cell = "2.1.1"
bt-hci = { version = "0.10.1", default-features = false }
trouble-host = { path = "vendor/trouble-host", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "extended-advertising", "security"] }

[dev-dependencies]
serde_json = "1.0.151"
futures = "0.3.34"
critical-section = { version = "1.2.0", features = ["std"] }

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "rt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# USB and storage dependencies
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8.0", features = ["defmt"] }

# BLE (trouble + nrf-sdc)
# nrf-sdc currently gates support_ext_adv() on central+peripheral. Pager only
# uses the peripheral role; keep the compile-time feature until upstream fixes
# that API gate. Trouble itself is built without its central feature.
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "e44e619d15eba9145453e3b2d7b07121556871ab", default-features = false, features = ["defmt", "peripheral", "central", "nrf52840"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "e44e619d15eba9145453e3b2d7b07121556871ab", default-features = false, features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.10.1", default-features = false, features = ["defmt"] }
trouble-host = { path = "vendor/trouble-host", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "extended-advertising", "defmt", "security"] }

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
panic = "abort"
strip = "symbols"

[patch.crates-io]
embassy-nrf = { path = "vendor/embassy-nrf" }
