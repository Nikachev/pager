[workspace]

[package]
name = "pager-bootloader-updater"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pager-bootloader-core = { path = "../bootloader-core" }
sha2 = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[features]
default = ["board-nice-nano-v2"]
board-nice-nano-v2 = []
board-xiao-nrf52840 = []

[build-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.8", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7.6", features = ["device"] }
