[workspace]

[package]
name = "pager-bootloader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
ed25519-dalek = { version = "2.1.1", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "rt"] }
critical-section = "1.2.0"
embassy-usb = { version = "0.6.0" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embedded-storage = "0.3.1"
usb-device = "0.3.2"
nrf-usbd = "0.3.0"
usbd-storage = { path = "usbd-storage", features = ["bbb", "scsi"] }
static_cell = "2.1.0"

[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
