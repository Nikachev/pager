[workspace]

[package]
name = "pager-bootloader"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
ed25519-dalek = { version = "2.1.1", default-features = false }
sha2 = { version = "0.10.8", default-features = false }

[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
