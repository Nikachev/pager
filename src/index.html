<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Pager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#18201b;font:14px system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto;padding:22px 16px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0;letter-spacing:-.5px}small,.muted{color:#68726b}.live{color:#18794e;font-size:12px}.live:before{content:'● ';font-size:10px}section{background:#fff;border:1px solid #dfe4df;border-radius:12px;padding:15px;margin:10px 0}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#68726b;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}button,input{font:inherit;border-radius:8px;border:1px solid #ccd5ce;padding:9px 11px}button{background:#fff;color:#18201b;cursor:pointer}button:hover{background:#f0f4f0}button:disabled{opacity:.45;cursor:wait}.primary{background:#1c6b48;color:white;border-color:#1c6b48}.primary:hover{background:#145738}.warn{color:#b13a2e;border-color:#e2b8b2}input{width:100%;background:#fff;min-width:0}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slot{padding:10px 6px;text-align:left}.slot b,.slot span{display:block}.slot span{font-size:11px;color:#68726b;margin-top:3px}.slot.on{border:2px solid #1c6b48;padding:9px 5px}.slot.bond span{color:#18794e}.line{min-height:20px;margin-top:9px;color:#68726b;font-size:12px}.ok{color:#18794e}.err{color:#b13a2e}label.file{display:block;border:1px dashed #aebbb1;padding:16px;border-radius:8px;text-align:center;color:#286945;cursor:pointer}pre{height:150px;overflow:auto;margin:0;border-radius:8px;background:#17211b;color:#d8e5dc;padding:10px;font:11px ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.bar{height:4px;background:#e5eae6;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#1c6b48;transition:width .1s}@media(max-width:390px){main{padding:16px 10px}.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:1 1 45%}}
</style>
<main><header><div><h1>Pager</h1><small>USB control panel</small></div><span id=live class=live>online</span></header>
<section><h2>Firmware update</h2><label class=file>Choose signed .pkg<input id=file type=file accept=.pkg,.bin hidden></label><div id=name class=line>No package selected</div><div class=row><button id=flash class=primary disabled>Upload update</button><span id=ota class=muted></span></div><div class=bar><i id=progress></i></div></section>
<section><h2>Bluetooth keyboard</h2><div id=slots class=slots></div><div class="row wrap" style="margin-top:9px"><button id=pair>Pair new host</button><button id=drop class=warn>Forget profile</button><button id=disconnect>Disconnect</button></div><div id=ble class=line>Loading profiles…</div></section>
<section><h2>Type through keyboard</h2><div class=row><input id=text maxlength=128 placeholder="Text to send"><button id=send class=primary>Send</button></div></section>
<section><h2>Diagnostics</h2><pre id=log>Loading…</pre><div class=row style="margin-top:9px"><button id=refresh>Refresh</button><span id=health class=muted></span></div></section></main>
<script>
const $=id=>document.getElementById(id),say=(id,t,c='')=>{let e=$(id);e.textContent=t;e.className='line '+c};let active=0;
async function api(path,opt){let r=await fetch(path,opt);if(!r.ok)throw Error(r.status);return r}
async function state(){try{let s=await(await api('/keyboard/state')).json();$('slots').innerHTML='';s.slots.forEach((x,i)=>{let b=document.createElement('button');b.className='slot '+(x.active?'on ':'')+(x.bonded?'bond':'');b.innerHTML='<b>Profile '+(i+1)+'</b><span>'+(x.bonded?'bonded':'empty')+'</span>';b.onclick=()=>slot(i);$('slots').append(b);if(x.active){active=i;$('drop').disabled=!x.bonded}});say('ble',s.pairing_mode?'Pairing is enabled — choose Pager on the host.':'Select a profile or enable pairing.','ok')}catch(e){say('ble','Bluetooth status unavailable','err')}}
async function post(path,body){try{await api(path,{method:'POST',body});await state()}catch(e){say('ble','Request failed ('+e.message+')','err')}}
const slot=i=>post('/keyboard/switch?slot='+i);$('pair').onclick=()=>post('/keyboard/pair');$('disconnect').onclick=()=>post('/keyboard/disconnect');$('drop').onclick=()=>{if(confirm('Forget the selected profile?'))post('/keyboard/delete?slot='+active)};
$('send').onclick=async()=>{let t=$('text').value;if(!t)return;$('send').disabled=true;try{await api('/keyboard/type',{method:'POST',body:t});$('text').value=''}catch(e){say('ble','Text was not sent ('+e.message+')','err')}finally{$('send').disabled=false}};$('text').onkeydown=e=>{if(e.key==='Enter')$('send').click()};
function crc(a){let c=-1;for(let b of a){c^=b;for(let i=0;i<8;i++)c=c&1?c>>>1^0xedb88320:c>>>1}return(c^-1)>>>0}$('file').onchange=()=>{let f=$('file').files[0];$('flash').disabled=!f;$('name').textContent=f?f.name+' · '+Math.ceil(f.size/1024)+' KiB':'No package selected'};
$('flash').onclick=async()=>{let f=$('file').files[0];if(!f)return;if(f.size>499712)return say('ota','Package is too large','err');$('flash').disabled=true;say('ota','Checking package…');let a=await f.arrayBuffer(),x=new XMLHttpRequest;x.open('POST','/update');x.setRequestHeader('X-Pager-CRC32',crc(new Uint8Array(a)).toString(16).padStart(8,'0'));x.upload.onprogress=e=>{if(e.lengthComputable){$('progress').style.width=(100*e.loaded/e.total)+'%';say('ota',Math.round(100*e.loaded/e.total)+'% uploaded')}};x.onload=()=>{let ok=x.status===200;say('ota',ok?'Update accepted; restarting…':'Upload failed ('+x.status+')',ok?'ok':'err');$('flash').disabled=false};x.onerror=()=>{say('ota','Connection lost','err');$('flash').disabled=false};x.send(f)};
async function logs(){try{$('log').textContent=await(await api('/logs')).text();$('log').scrollTop=$('log').scrollHeight}catch(e){$('log').textContent='Log unavailable'}}async function status(){try{let x=await(await api('/health')).json();$('health').textContent='slot '+(x.slot?'B':'A')+' · v'+x.firmware_version}catch(e){$('live').textContent='offline';$('live').className='err'}}$('refresh').onclick=()=>{logs();status()};state();logs();status();setInterval(state,4000);setInterval(logs,3000);
</script>
